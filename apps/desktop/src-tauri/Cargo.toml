[package]
name = "open-note-desktop"
description = "Open Note desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "open_note_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
git-port = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = { workspace = true }
# For the (off-by-default) pasted-URL title lookup. `ureq` over reqwest: one
# blocking call from a command thread, no async runtime, a fraction of the
# compile weight.
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
