name: Release

# Tag a commit on main to publish downloadable builds:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag name becomes the app version, so the bundles carry a real version
# rather than the 0.0.0 placeholder in tauri.conf.json.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A tag pointing at a commit that never landed on main would publish a build
  # of code nobody reviewed. Check before spending 20 minutes building it.
  guard:
    name: Check the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          # Checking out a tag leaves a detached HEAD with no remote-tracking
          # branch, so fetch main explicitly rather than assuming origin/main.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Releases are cut from main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

  build:
    name: Build (${{ matrix.label }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads, so nobody has to
          # know whether their Mac is Intel or Apple silicon.
          # `universal-apple-darwin` is a Tauri concept, not a rustup target:
          # it lipo's the two real ones together, so both must be installed.
          - os: macos-latest
            label: macOS (universal)
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # `app` as well as `dmg`, even though only the .dmg is a download.
            # createUpdaterArtifacts emits the signed .app.tar.gz the updater
            # installs, but only when the `app` target is among those built —
            # a dmg-only build logs a warning and produces no macOS entry in
            # latest.json, so every Mac's update check fails with "none of the
            # fallback platforms were found". tauri-action drops the raw .app
            # once the tarball exists, so this adds the updater artifact and
            # nothing else.
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-latest
            label: Linux
            rust-targets: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-latest
            label: Windows
            rust-targets: x86_64-pc-windows-msvc
            args: ''

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.os }}

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev

      - run: pnpm install --frozen-lockfile

      # This minisign key authenticates updater artifacts on every platform.
      # It is separate from macOS code signing/notarisation and Windows
      # Authenticode; without it Tauri deliberately refuses to install.
      - name: Check the updater signing secret is present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret: TAURI_SIGNING_PRIVATE_KEY. See docs/RELEASING.md."
            exit 1
          fi
          echo "Updater signing key is present."

      # The bundles must carry the released version, not the placeholder.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.argv[1];
            // Ordinary local and nightly builds do not have the production
            // updater key. Only tagged releases create updater artifacts.
            conf.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          " "$VERSION"
          echo "Building version $VERSION"

      - name: Work out the bundle arguments
        id: bundles
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          # Windows Installer versions cannot express a non-numeric pre-release
          # identifier, so `v0.2.0-beta.1` has no valid MSI version. That is a
          # Windows rule, not a Tauri one, and there is no way around it — so a
          # pre-release ships the NSIS installer only.
          if [[ "$RUNNER_OS" == "Windows" && "$GITHUB_REF_NAME" == *-* ]]; then
            ARGS="$ARGS --bundles nsis"
            echo "::notice::Pre-release tag: building the NSIS installer only, as MSI cannot express version ${GITHUB_REF_NAME#v}."
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # macOS signing and notarisation. Only the macOS leg needs any of this;
      # Windows and Linux build exactly as before.
      #
      # Fail here rather than twenty minutes later: without these, the build
      # still "succeeds" and quietly publishes an ad-hoc-signed .dmg that
      # Gatekeeper rejects, which is the failure this whole step exists to
      # prevent. Better to name the missing secret up front.
      - name: Check the signing secrets are present
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          echo "All six macOS signing secrets are present."

      # notarytool wants the key as a file, not a variable, so the secret holds
      # it base64-encoded and it is decoded here. The runner is destroyed after
      # the job, so $RUNNER_TEMP is as good a home as any.
      - name: Write the App Store Connect API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          # Never print the key. Its size is enough to tell "decoded fine" from
          # "the secret was pasted with the wrong encoding".
          echo "Wrote $(wc -c < "$RUNNER_TEMP/AuthKey.p8") bytes."
          head -1 "$RUNNER_TEMP/AuthKey.p8" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key."; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read only by the macOS bundler; harmless and empty elsewhere.
          # The Tauri CLI imports the certificate into a temporary keychain
          # itself, so there is no keychain juggling to do here.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation via an App Store Connect API key rather than an Apple
          # ID and app-specific password: it is not tied to one person's account
          # or their 2FA, and it can be revoked on its own without changing
          # anyone's Apple password.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Open Note ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS (Intel and Apple silicon) | `.dmg` |
            | Windows | `.exe` (installer) or `.msi` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            macOS builds are signed with a Developer ID certificate and
            notarised by Apple, so they open without a warning.

            ### Windows builds are not code-signed yet

            SmartScreen will warn before running the installer; choose
            **More info** → **Run anyway**. Signing is tracked in the issues.
          # Draft until every leg has finished and the macOS DMG has been
          # notarised and checked. tauri-action publishes the moment it uploads,
          # which would put an un-notarised DMG in front of people for the two
          # minutes the fix-up takes. The publish job below flips this off.
          releaseDraft: true
          # v0 calls this input includeUpdaterJson. Each matrix leg merges its
          # signed platform artifact into the release's latest.json manifest.
          includeUpdaterJson: true
          # A tag like v0.2.0-beta.1 publishes as a pre-release automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ steps.bundles.outputs.args }}

      # Tauri notarises the .app and staples it, then builds the DMG from it and
      # only *signs* the DMG. Gatekeeper assesses the DMG first when someone
      # downloads it, so an un-notarised container still shows the warning even
      # though the app inside is perfect. Submit the DMG too.
      - name: Notarise and staple the DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          DMG=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::No .dmg found to notarise."; exit 1; }
          echo "Notarising $DMG"

          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG"

          # Verify rather than trust. The previous release built green while
          # producing a DMG Gatekeeper rejected, because nothing checked.
          xcrun stapler validate "$DMG"
          if ! spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"; then
            echo "::error::The DMG is not notarised. Refusing to publish it."
            exit 1
          fi

          # Replace the copy tauri-action already uploaded with the stapled one.
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Stapled DMG uploaded."

  # Nothing is public until every platform built and the DMG passed its
  # Gatekeeper check.
  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Each matrix leg merges its own platform into latest.json, so a leg that
      # builds green while emitting no updater artifact leaves a manifest that
      # is missing a platform — invisible here, and surfacing much later as
      # "None of the fallback platforms ... were found" in front of a user who
      # has already installed. Check the manifest while the release is still a
      # draft, for the same reason the DMG's notarisation is checked.
      - name: Check latest.json covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir . --clobber
          missing=()
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg k "$key" \
              '.platforms[$k].url and .platforms[$k].signature' latest.json >/dev/null \
              || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Manifest contains:"
            jq '.platforms | keys' latest.json
            echo "::error::latest.json has no usable entry for: ${missing[*]}. In-app updates would fail there, so this release will not be published."
            exit 1
          fi
          echo "latest.json covers every platform."

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "Published $GITHUB_REF_NAME."
